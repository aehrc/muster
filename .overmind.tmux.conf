# Loaded by overmind (see the `dev` script in package.json) as the tmux config
# for its private tmux server. tmux expands $PATH here from that server's own
# environment - i.e. the shell that ran `bun run dev` - and copies it into the
# global session environment, so every process window inherits the caller's
# full PATH. Without this, tmux gives windows after the first a bare system
# PATH on some setups, and bun would not be found.
#
# Author: John Grimes

set-environment -g PATH "$PATH"
