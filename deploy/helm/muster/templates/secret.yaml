{{- /*
The Secret the chart holds, for a trial install that has not been given one.

Only rendered when muster.secretConfig has something in it. A deployment sets
muster.existingSecret instead: anything in secretConfig is stored in the release,
and a credential in a release is a credential anybody who can read releases has.

Author: John Grimes
*/ -}}
{{- if .Values.muster.secretConfig }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.muster.secretConfig }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
