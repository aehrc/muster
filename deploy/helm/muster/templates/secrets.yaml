{{- /*
The Secrets the chart creates when it was not pointed at existing ones.

The two connection URLs are separate Secrets rather than two keys of one, so
that the Deployment can be given the serving role without the owning identity
being mounted alongside it - a pod can select a key, but the blast radius of a
mounted Secret is the Secret.

Nothing here is the preferred shape. A credential passed through `--set` is a
credential in a shell history, a CI log and `helm get values`; the
`existingSecret` fields exist so that a real deployment never puts one in this
chart's values at all.
*/ -}}
{{- if not .Values.muster.database.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "muster.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.muster.database.url | quote }}
{{- end }}
{{- if and .Values.muster.migrations.enabled (not .Values.muster.database.ownerExistingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-owner
  labels:
    {{- include "muster.labels" . | nindent 4 }}
type: Opaque
stringData:
  ownerUrl: {{ .Values.muster.database.ownerUrl | quote }}
{{- end }}
{{- if not .Values.muster.masterKey.existingSecret }}
{{- /*
Read back from the cluster before generating, because a key generated afresh on
every upgrade would replace the one the stored signing keys were encrypted
under. `lookup` returns nothing during `helm template`, which is why rendering
the chart produces a different key each time and installing it does not.
*/ -}}
{{- $secretName := printf "%s-master-key" .Release.Name }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
{{- $existingData := (get $existing "data") | default dict }}
{{- $masterKey := .Values.muster.masterKey.value | default (get $existingData "masterKey" | b64dec) | default (randAlphaNum 44) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
  annotations:
    # Generated once on install and preserved across upgrades. Losing this key
    # makes every stored signing key undecryptable, which ends the verifiability
    # of everything signed with them.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  masterKey: {{ $masterKey | quote }}
{{- end }}
{{- if and .Values.muster.smtp.url (not .Values.muster.smtp.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-smtp
  labels:
    {{- include "muster.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.muster.smtp.url | quote }}
{{- end }}
{{- if gt (len .Values.muster.secretConfig) 0 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "muster.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.muster.secretConfig }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
