{{- /*
The service in front of the single instance.

Author: John Grimes
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  labels:
    app: {{ .Release.Name }}
spec:
  type: {{ .Values.muster.service.type | quote }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.muster.service.port }}
      targetPort: http
      protocol: TCP
