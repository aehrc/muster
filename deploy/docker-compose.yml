# The local stack: Muster, its database, the migration between them, and the stub registration
# server that quickstart scenario 3 and the conformance harness run against.
#
# The stub data holder joins it with the user story that needs it, and the end-to-end suite runs
# against whatever this file brings up.
#
# Ports are read from the environment rather than fixed, so that a developer whose 3000 or 5432 is
# taken can move the stack without editing this file - and so that CI can prove every URL in the
# stack is derived rather than hard-coded by running it on non-default ports.

name: muster

services:
  postgres:
    image: postgres:18-alpine
    environment:
      # The identity that owns the schema, and therefore the one that migrates.
      POSTGRES_USER: muster
      POSTGRES_PASSWORD: muster
      POSTGRES_DB: muster
    ports:
      - "${POSTGRES_PORT:-55434}:5432"
    volumes:
      # Mounted at the parent rather than at `data`, which is what the Postgres 18
      # image asks for: it places the cluster in a subdirectory so that a later
      # `pg_upgrade --link` does not cross a mount boundary. Mounting `data`
      # directly makes the image refuse to initialise.
      - postgres:/var/lib/postgresql
      # Creates the non-owning serving role, once, when the cluster is initialised. The migration
      # grants that role its access but cannot create it. See the script's own header.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muster -d muster"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies the migrations and grants the serving role, then exits. A separate service rather than
  # a step inside the server, because migrations are DDL and a server that could issue DDL is a
  # server that can half-migrate a database. `muster` waits for this to succeed.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["bun", "dist/index.js", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MUSTER_DATABASE_OWNER_URL: postgresql://muster:muster@postgres:5432/muster
      MUSTER_DATABASE_URL: postgresql://muster_app:muster_app@postgres:5432/muster
    restart: "no"

  muster:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      # Every public URL Muster emits derives from this one, so it must be the
      # address a browser outside the stack uses rather than the service name.
      MUSTER_PUBLIC_URL: http://localhost:${MUSTER_PORT:-3000}
      # The serving identity: it can read and write every table and cannot issue DDL.
      MUSTER_DATABASE_URL: postgresql://muster_app:muster_app@postgres:5432/muster
      # A throwaway key: this stack holds nothing worth protecting, and a real
      # deployment reads its own from a secret.
      MUSTER_MASTER_KEY: 0123456789abcdef0123456789abcdef
      # The identifier system a persona's IHI is searched by, fixed by AU Base's `au-ihi`
      # profile. Required rather than defaulted: see `apps/server/src/config.ts`.
      MUSTER_IHI_SYSTEM: http://ns.electronichealth.net.au/id/hi/ihi/1.0
      # No SMTP relay, which selects the console transport: every message Muster sends is printed
      # to this service's log. That is how the quickstart reads a verification link, and it is why
      # `MUSTER_SMTP_URL` must be set in anything that is not a development stack.
      MUSTER_LOG_LEVEL: debug
      # The stub sits on a private compose address, which the outbound guard refuses by
      # default. Naming it here is the exemption, and the port is part of the match: exempting
      # the stub does not exempt anything else on the network. Never set in production.
      MUSTER_OUTBOUND_ALLOWED_HOSTS: stub-server:8443
      # The stub serves TLS with the throwaway certificate in `stubs/tls`, because a server
      # entry's registration endpoint and FHIR base URL must be https - see that directory's
      # README. This is what makes Muster trust it, and nothing else.
      NODE_EXTRA_CA_CERTS: /stubs/tls/stub.crt
    volumes:
      - ./stubs/tls:/stubs/tls:ro
    ports:
      - "${MUSTER_PORT:-3000}:3000"

  # A reference implementation of `contracts/registration-profile.md`: it accepts a
  # statement-only registration, verifies it against Muster's published keys, and refuses a
  # tampered, expired or replayed one. `STUB_BROKEN_MODE` turns individual rules off so the
  # conformance harness can be shown to fail when the far end is wrong.
  #
  # Run from the mounted source by the Bun image rather than built: it has no dependencies -
  # its JOSE verification is Web Crypto - so there is nothing to install, and a counterparty
  # that shared a JOSE implementation with Muster would agree with it about any shared bug.
  stub-server:
    image: oven/bun:1-debian
    command: ["bun", "run", "/stubs/registerServer.ts"]
    depends_on:
      muster:
        condition: service_started
    environment:
      STUB_PORT: 8443
      # The issuer a statement must carry: the address a browser outside the stack uses, which
      # is what Muster puts in `iss`.
      STUB_ISSUER: http://localhost:${MUSTER_PORT:-3000}
      # Where the keys are fetched from, which is inside the network. Split horizon, exactly as
      # a real deployment behind a load balancer would have.
      STUB_JWKS_URL: http://muster:3000/.well-known/jwks.json
      STUB_TLS_CERT: /stubs/tls/stub.crt
      STUB_TLS_KEY: /stubs/tls/stub.key
      # Empty: the stub is conformant unless a run deliberately breaks it. Set it to
      # `skip-signature` for quickstart scenario 4's second half.
      STUB_BROKEN_MODE: "${STUB_BROKEN_MODE:-}"
    volumes:
      - ./stubs:/stubs:ro
    ports:
      - "${STUB_SERVER_PORT:-8443}:8443"

volumes:
  postgres:
