# Local Muster stack.
#
# Muster, its database, and the stub registration server that makes trusted
# dynamic client registration provable without a vendor's server. The stub data
# holder joins this file with the ticket playground (User Story 8).
#
# Author: John Grimes

name: muster

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: muster_owner
      POSTGRES_PASSWORD: muster_owner
      POSTGRES_DB: muster
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18 images expect a single mount here, with the cluster in a
      # subdirectory, so that a future pg_upgrade --link stays inside one mount.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muster_owner -d muster"]
      interval: 5s
      timeout: 5s
      retries: 20

  muster:
    # Named so the stack never reuses a similarly named image from elsewhere;
    # bring the stack up with --build to pick up source changes.
    image: muster:local
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Every public URL Muster mints or advertises derives from this.
      MUSTER_PUBLIC_URL: http://localhost:8080
      MUSTER_PORT: 8080
      # Owner role applies migrations; the serving role only reads and writes.
      MUSTER_MIGRATION_DATABASE_URL: postgresql://muster_owner:muster_owner@postgres:5432/muster
      MUSTER_DATABASE_URL: postgresql://muster_server:muster_server@postgres:5432/muster
      MUSTER_SERVER_DATABASE_ROLE: muster_server
      MUSTER_SERVER_DATABASE_PASSWORD: muster_server
      # Development value only; deployments supply this from a secret.
      MUSTER_MASTER_KEY: development-master-key-not-for-deployment
      # Unset MUSTER_SMTP_URL, so mail is written to the log instead of sent.
      #
      # The stub sits on this compose network, whose addresses are private, and
      # the address guard refuses private ranges by design. Naming it here is
      # what lets the stack demonstrate a registration run without weakening the
      # guard: a deployment leaves this unset, and then no private address is
      # reachable at all.
      MUSTER_OUTBOUND_ALLOWLIST: register-stub:9090
      # The identifier system an event persona's IHI is asserted under. This is
      # the default; it is named here so a deployment curating from another
      # programme's source server can see that it is configuration.
      MUSTER_IHI_SYSTEM: http://ns.electronichealth.net.au/id/hi/ihi/1.0
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  register-stub:
    # A participant's authorization server, implementing the registration
    # profile Muster publishes at /docs/registration-profile. No dependencies,
    # so it runs from a bare Bun image with one file mounted in; every broken
    # mode the conformance harness needs is reachable as
    # /modes/{mode}/register on the same instance.
    image: oven/bun:1.3-alpine
    working_dir: /stubs
    command: ["bun", "run", "registerServer.ts"]
    volumes:
      - ./stubs:/stubs:ro
    environment:
      STUB_PORT: 9090
      # The anchor it trusts, and where that anchor publishes its keys. Reached
      # over the compose network, not through the published port.
      STUB_ISSUER: http://localhost:8080
      STUB_JWKS_URL: http://muster:8080/.well-known/jwks.json
      STUB_MODE: strict
      # A Muster entry's registration endpoint must be an https URL, as a real
      # participant's is, so driving a registration run against this stub needs a
      # certificate here - and, for a self-signed one, a Muster container willing
      # to accept it. Left out of the committed stack rather than shipping a
      # private key in the repository:
      #   STUB_TLS_CERT: /stubs/tls/cert.pem
      #   STUB_TLS_KEY: /stubs/tls/key.pem
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:9090/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
