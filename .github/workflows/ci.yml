# Continuous integration for Muster.
#
# Author: John Grimes

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  checks:
    name: Static analysis and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: muster
          POSTGRES_PASSWORD: muster
          POSTGRES_DB: muster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muster -d muster_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Supplied so the integration suites run. MUSTER_REQUIRE_DATABASE_TESTS
      # turns an absent URL into a failure, so they cannot silently skip.
      MUSTER_TEST_DATABASE_URL: postgresql://muster:muster@localhost:5432/muster_test
      MUSTER_REQUIRE_DATABASE_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Check duplication
        run: bun run lint:duplication

      - name: Test with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Check bundle
        run: bun run check:bundle

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The image build runs scripts/checkBundle.mjs, so a dependency that
      # cannot be bundled fails here.
      - name: Build image
        run: docker build -t muster:ci .

      # Configuration is deny by default, so the container needs a complete
      # environment to start at all. Nothing here reaches a database: the smoke
      # test only proves the bundle boots and answers on /healthz.
      - name: Smoke test the image
        run: |
          docker run -d --name muster-smoke -p 8080:8080 \
            -e MUSTER_PUBLIC_URL=http://localhost:8080 \
            -e MUSTER_MASTER_KEY=smoke-test-master-key-not-a-secret \
            -e MUSTER_DATABASE_URL=postgresql://muster@127.0.0.1:5432/muster \
            -e MUSTER_MIGRATION_DATABASE_URL=postgresql://muster@127.0.0.1:5432/muster \
            muster:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then
              echo
              echo "Smoke test: the server answered on /healthz"
              docker rm -f muster-smoke
              exit 0
            fi
            sleep 1
          done
          echo "Smoke test: the server never answered on /healthz"
          docker logs muster-smoke
          docker rm -f muster-smoke
          exit 1

  helm:
    name: Helm lint and render
    runs-on: ubuntu-latest

    strategy:
      # Both supported lines, because the chart is installed with whichever one
      # an operator happens to have.
      matrix:
        helm-version: ["v3.19.4", "v4.2.4"]

    env:
      RELEASE: >-
        --set muster.publicUrl=https://muster.example.org
        --set muster.existingSecret=muster-credentials

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm-version }}

      - name: Lint the chart
        run: helm lint deploy/helm/muster $RELEASE

      - name: Render the chart
        run: helm template muster deploy/helm/muster $RELEASE

      # The constitution pins a single replica, because the scheduler runs in
      # process. A chart that rendered two would break that silently, so the
      # rendered output is asserted rather than trusted.
      - name: Check the render pins one replica
        run: |
          helm template muster deploy/helm/muster $RELEASE > rendered.yaml
          grep -qx "  replicas: 1" rendered.yaml
          grep -q "type: Recreate" rendered.yaml
          grep -q "muster-credentials" rendered.yaml
          test "$(grep -c 'replicas:' rendered.yaml)" = 1

      # Configuration is deny by default in the chart as well as in the server: a
      # release with no public URL, or with no credentials, must not render at
      # all.
      - name: Check the chart refuses an incomplete release
        run: |
          if helm template muster deploy/helm/muster; then
            echo "The chart rendered without a public URL"
            exit 1
          fi
          if helm template muster deploy/helm/muster \
            --set muster.publicUrl=https://muster.example.org; then
            echo "The chart rendered without any credentials"
            exit 1
          fi

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Start the stack
        run: bun run stack:up

      # The admin account and the open event every scenario runs inside. Reads
      # deploy/stack.env, so the values are the stack's own.
      - name: Seed the stack
        run: bun run stack:seed

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Quickstart scenarios 1 to 7. The addresses default to the compose
      # network's names, so only Muster's own published address is given here.
      - name: Run the suite
        run: bun run test:e2e
        env:
          MUSTER_E2E_BASE_URL: http://localhost:8080

      - name: Stack logs on failure
        if: failure()
        run: bun run stack:logs

      - name: Stop the stack
        if: always()
        run: bun run stack:down

      # Playwright writes its report beside its configuration, which is in e2e/.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: warn
